[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-stankey"
version = "0.1.0"
description = "Auditable quarterly income-statement Sankey images"
requires-python = ">=3.10"
dependencies = ["resvg_py>=0.3,<0.6"]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
stankey = "stankey.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
